<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img"
     aria-label="设置面板「钉钉文档」结构示意（非截图）">
  <title>设置面板「钉钉文档」结构示意（非截图）</title>
  <defs>
    <style>
      .bg   { fill: #FAFCFF; }
      .card { fill: #FFFFFF; stroke: #D7E5F7; stroke-width: 1.5; }
      .zone { fill: #F7FAFF; stroke: #C9DEFF; stroke-width: 1.5; }
      .hi   { fill: #E8F2FF; stroke: #1677FF; stroke-width: 2; }
      .t    { font: 400 16px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #24405F; }
      .th   { font: 700 19px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #0B2340; }
      .tb   { font: 700 17px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #1677FF; }
      .ts   { font: 400 14px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #6B87A6; }
      .mono { font: 400 14px/1 ui-monospace,Consolas,monospace; fill: #3C6A9E; }
      .chip { fill: #FFFFFF; stroke: #BAD4F5; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" rx="18"/>

  <!-- 标题 -->
  <text class="th" x="36" y="46">设置 →「钉钉文档」面板结构示意</text>
  <text class="ts" x="36" y="72">示意图，非界面截图。实际面板配色与排版以运行版本为准。</text>
  <line x1="36" y1="92" x2="1164" y2="92" stroke="#D7E5F7" stroke-width="1.5"/>

  <!-- 左：设置侧栏 -->
  <rect class="card" x="36" y="116" width="240" height="608" rx="12"/>
  <text class="tb" x="56" y="148">设置</text>
  <g class="t">
    <rect class="chip" x="52" y="166" width="208" height="36" rx="8"/>
    <text x="68" y="189">通用</text>
    <rect class="chip" x="52" y="210" width="208" height="36" rx="8"/>
    <text x="68" y="233">模型</text>
    <rect class="chip" x="52" y="254" width="208" height="36" rx="8"/>
    <text x="68" y="277">工具</text>
    <rect class="chip" x="52" y="298" width="208" height="36" rx="8"/>
    <text x="68" y="321">IM机器人</text>

    <rect class="hi" x="52" y="342" width="208" height="36" rx="8"/>
    <text x="68" y="365" font-weight="700" fill="#0B5FD9">钉钉文档</text>
    <text class="ts" x="196" y="365">order 22</text>
  </g>

  <!-- 右：面板主体 -->
  <rect class="card" x="300" y="116" width="864" height="608" rx="12"/>
  <text class="th" x="324" y="150">钉钉文档</text>
  <text class="ts" x="324" y="176">账号绑定 · AI 表格清单 · 定时导出</text>

  <!-- 区 1 账号绑定 -->
  <rect class="zone" x="324" y="196" width="816" height="128" rx="10"/>
  <text class="tb" x="344" y="224">① 账号绑定</text>
  <g class="t">
    <rect class="chip" x="344" y="238" width="248" height="30" rx="7"/><text x="358" y="259">CLI 版本</text>
    <rect class="chip" x="602" y="238" width="248" height="30" rx="7"/><text x="616" y="259">企业名 / 用户名</text>
    <rect class="chip" x="860" y="238" width="260" height="30" rx="7"/><text x="874" y="259">access token 到期</text>

    <rect class="chip" x="344" y="276" width="248" height="30" rx="7"/><text x="358" y="297">凭证来源</text>
    <rect class="chip" x="602" y="276" width="248" height="30" rx="7"/><text x="616" y="297">写门禁状态</text>
    <rect class="hi" x="860" y="276" width="260" height="30" rx="7"/><text x="874" y="297" font-weight="700" fill="#0B5FD9">扫码绑定</text>
  </g>

  <!-- 区 2 AI 表格清单 -->
  <rect class="zone" x="324" y="340" width="816" height="192" rx="10"/>
  <text class="tb" x="344" y="368">② AI 表格清单</text>
  <rect class="chip" x="344" y="382" width="420" height="32" rx="7"/>
  <text class="ts" x="358" y="403">输入关键词（可多个，逗号分隔）…</text>
  <rect class="hi" x="776" y="382" width="150" height="32" rx="7"/>
  <text x="800" y="403" class="tb">扫描</text>

  <!-- 结果行 -->
  <g class="t">
    <rect class="chip" x="344" y="426" width="582" height="30" rx="7"/>
    <circle cx="362" cy="441" r="7" fill="#27AE60"/>
    <text x="380" y="447">Base A</text>
    <text class="mono" x="470" y="447">baseId</text>
    <text class="ts" x="640" y="447">可读 · 3 张表</text>

    <rect class="chip" x="344" y="462" width="582" height="30" rx="7"/>
    <circle cx="362" cy="477" r="7" fill="#E74C3C"/>
    <text x="380" y="483">Base B</text>
    <text class="mono" x="470" y="483">baseId</text>
    <text class="ts" x="640" y="483">不可读 · 权限原因已记录</text>

    <rect class="chip" x="344" y="498" width="582" height="26" rx="6" opacity="0.6"/>
    <text class="ts" x="358" y="517">人工补录：直接粘贴 baseId</text>
  </g>
  <g class="t">
    <rect class="chip" x="944" y="426" width="176" height="98" rx="8"/>
    <text class="ts" x="958" y="450">选中表后</text>
    <text x="958" y="476">复制 Base ID</text>
    <text x="958" y="500">复制 Table ID</text>
  </g>

  <!-- 区 3 定时导出 -->
  <rect class="zone" x="324" y="552" width="816" height="152" rx="10"/>
  <text class="tb" x="344" y="580">③ 定时导出</text>
  <g class="t">
    <rect class="chip" x="344" y="594" width="200" height="30" rx="7"/><text x="358" y="615">选中的表</text>
    <rect class="chip" x="554" y="594" width="300" height="30" rx="7"/><text x="568" y="615">输出路径（绝对路径）</text>
    <rect class="chip" x="864" y="594" width="120" height="30" rx="7"/><text x="878" y="615">每天/每周</text>
    <rect class="chip" x="994" y="594" width="126" height="30" rx="7"/><text x="1008" y="615">09:00</text>

    <rect class="chip" x="344" y="636" width="776" height="52" rx="8"/>
    <text class="ts" x="358" y="658">任务行：下次触发时间 · 上次执行结果 · 立即执行 · 启停 · 删除</text>
    <text class="ts" x="358" y="678">⚠️ 定时器跑在 DSH host 进程内 —— DSH 关着时不执行</text>
  </g>

  <!-- 页脚：能力边界 -->
  <text class="ts" x="36" y="748">注：面板可调的 RPC 方法全部为只读或本地文件操作，不触碰钉钉写接口。</text>
</svg>
