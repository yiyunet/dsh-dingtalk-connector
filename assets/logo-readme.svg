<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img"
     aria-label="dsh-dingtalk-connector — 钉钉 AI 表格接入 DeepSeek Harness">
  <title>dsh-dingtalk-connector</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#E4EFFF"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E90FF"/>
      <stop offset="1" stop-color="#0B5FD9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t1 { font: 700 62px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #0B2340; }
      .t2 { font: 400 30px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #3C6A9E; }
      .t3 { font: 500 24px/1 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill: #1677FF; }
    </style>
  </defs>

  <!-- 自带底色，保证在 GitHub 浅色/深色主题下都可读 -->
  <rect x="0" y="0" width="960" height="640" rx="36" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="959" height="639" rx="36" fill="none" stroke="#C9DEFF" stroke-width="1"/>

  <!-- 左：图标 -->
  <g transform="translate(96 168) scale(1.0)">
    <rect x="0" y="0" width="304" height="304" rx="72" fill="url(#mark)"/>
    <rect x="0" y="0" width="304" height="304" rx="72" fill="url(#sheen)"/>
    <g fill="#FFFFFF">
      <rect x="61" y="74" width="182" height="33" rx="10" opacity="0.95"/>
      <rect x="61" y="122" width="53" height="33" rx="9" opacity="0.72"/>
      <rect x="126" y="122" width="53" height="33" rx="9" opacity="0.72"/>
      <rect x="190" y="122" width="53" height="33" rx="9" opacity="0.72"/>
      <rect x="61" y="170" width="53" height="33" rx="9" opacity="0.72"/>
      <rect x="126" y="170" width="53" height="33" rx="9" opacity="0.72"/>
      <rect x="190" y="170" width="53" height="33" rx="9" opacity="0.72"/>
    </g>
    <g transform="translate(178 204)">
      <circle cx="38" cy="38" r="38" fill="#FFFFFF"/>
      <path d="M23 38 h23 m-9 -10 l10 10 l-10 10" fill="none" stroke="#0B5FD9" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 右：文字 -->
  <g transform="translate(452 214)">
    <text class="t1" x="0" y="0">dsh-dingtalk</text>
    <text class="t1" x="0" y="70">-connector</text>
    <text class="t2" x="0" y="132">钉钉 AI 表格 · 接入 DeepSeek Harness</text>
    <text class="t3" x="0" y="186">读写 · 导出 · 定时同步</text>
  </g>

  <!-- 底：非官方声明 -->
  <text x="480" y="596" text-anchor="middle"
        font-family="Segoe UI,PingFang SC,Microsoft YaHei,system-ui,sans-serif"
        font-size="20" fill="#7A96B8">非官方社区集成 · 包装钉钉官方 dws CLI</text>
</svg>
